name: Rastreador CI
on:
  push:
    branches: [main]
    paths:
      - "projeto/rastreador-editais/**"
      - ".github/workflows/rastreador.yml"
  pull_request:
    branches: [main]
    paths:
      - "projeto/rastreador-editais/**"
      - ".github/workflows/rastreador.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RASTREADOR_PUBLIC_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projeto/rastreador-editais/requirements-ci.txt
      - run: python -m pip install -r projeto/rastreador-editais/requirements-ci.txt
      - run: python -m pytest -q
        working-directory: projeto/rastreador-editais
